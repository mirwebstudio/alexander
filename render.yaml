services:
  - type: web
    name: alexander
    runtime: python
    rootDir: ALEXANDER_AI_FINAL
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT
    healthCheckPath: /_stcore/health
    envVars:
      - key: ALEXANDER_PASSWORD
        sync: false
